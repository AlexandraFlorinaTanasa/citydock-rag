image: python:3.12-slim

pipelines:
  pull-requests:
    '**': # Rulează pe orice PR
      - step:
          name: Linting and Static Analysis
          script:
            - pip install ruff mypy
            - ruff check . # Verificare stil și erori comune
            - mypy . # Verificare tipuri de date
      - step:
          name: Unit Tests with Coverage
          script:
            - pip install -r requirements.txt pytest pytest-cov
            - pytest --cov=app tests/ # Verificare acoperire minimă 80%
      - step:
          name: Security Scan (Trivy)
          services:
            - docker
          script:
            - apt-get update && apt-get install -y wget
            - wget https://github.com/aquasecurity/trivy/releases/download/v0.48.3/trivy_0.48.3_Linux-64bit.deb
            - dpkg -i trivy_0.48.3_Linux-64bit.deb
            - docker build -t temp-image .
            - trivy image --severity HIGH,CRITICAL --exit-code 1 temp-image # Eșuează dacă găsește vulnerabilități mari

  branches:
    main: # Pipeline pentru branch-ul principal
      - step:
          name: Full Validation for Release
          # Repetă pașii de testare și scanare înainte de tag-ul final
          script:
            - echo "Validating main branch..."
